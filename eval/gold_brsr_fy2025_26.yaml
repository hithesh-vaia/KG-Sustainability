# ---------------- employee_safety ----------------
- id: brsr_016
  # Was must_include ["no","none"]: "no" is a substring of "not"/"none"/"nominal",
  # so any answer -- including a refusal -- scored as a pass. Assert the substantive
  # claim (a reported count of zero) and forbid the opposite claim instead.
  question: "Were there any high-consequence work-related injuries, ill-health cases or fatalities among bank employees/workers in FY 2025-26?"
  method: local
  category: employee_safety
  must_include: [["none", "zero", "nil", "no high-consequence", "no fatalities"]]
  expected: "No. The report states there were none (zero fatalities and zero high-consequence injuries)."
  source: "Principle 3, BRSR page 328 (BRSR-FY-2025-26(1).pdf)"
  type: negative_fact
  difficulty: easy

- id: brsr_017
  question: "What occupational safety system has IDBI Bank adopted?"
  method: both
