# ---------------- retrieval_abstention ----------------
- id: brsr_035
  question: "What was IDBI Bank's Scope 3 financed-emissions total for its entire loan portfolio in FY 2025-26?"
  method: local
  category: retrieval_abstention
  # must_not_include used to be ["financed emissions total", "entire loan portfolio"],
  # which are lifted verbatim from the question -- a correct refusal that restates
  # the question ("the context does not provide the financed emissions total for the
  # entire loan portfolio") tripped them, so the item could never pass. Forbid an
  # actual fabricated total instead, and accept any wording of the refusal.
  must_include:
    - ["does not provide", "does not disclose", "not disclosed", "no such total", "not provided"]
    - ["business travel", "air travel"]
    - ["sample loan portfolio", "sample portfolio"]
  must_not_include: ["tco2e for the entire loan portfolio"]
  expected: "The BRSR does not provide such a total. It says disclosed Scope 3 is business travel (air travel only), while a financed-emissions assessment was conducted for a sample loan portfolio."
  source: "Scope 3 disclosure and climate discussion, BRSR pages 349 and 287 (BRSR-FY-2025-26(1).pdf)"
  type: unanswerable
  difficulty: adversarial

