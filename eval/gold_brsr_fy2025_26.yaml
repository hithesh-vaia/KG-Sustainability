# Gold Q&A for IDBI BRSR FY 2025-26, converted from
# brsr_fy2025_26_graphrag_eval.jsonl (36 items).
#
# Source schema -> harness schema:
#   expected_answer -> expected     must_not_claim -> must_not_include
#   type/difficulty kept as metadata (unused by the scorer, handy for filtering)
#   method inferred from type: semantic -> both, everything else -> local
#
# NOTE: items marked `# review:` have must_include needles short enough that
# substring matching passes on almost any answer -- tighten before trusting them.

# ---------------- accessibility ----------------
- id: brsr_022
  question: "As of March 31, 2026, how many branches had ramps, how many were installing ramps, how many did not require ramps, and how many were on upper floors where ramps were infeasible?"
  method: local
  category: accessibility
  must_include: ["1078", "33", "293", "770"]
  expected: "1,078 had ramps; 33 were installing ramps; 293 did not require ramps; 770 were on upper floors where ramps were infeasible."
  source: "Principle 5 leadership indicators, BRSR page 326 (BRSR-FY-2025-26(1).pdf)"
  type: numeric
  difficulty: hard

