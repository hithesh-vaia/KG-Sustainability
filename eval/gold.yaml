# ---------------- Governance ----------------
- id: assurance-provider-fy25
  question: "Who provided assurance for IDBI Bank's BRSR for FY 2024-25?"
  method: local
  category: governance
  must_include: ["Chokshi & Chokshi", "Suri & Co"]
  expected: "Chokshi & Chokshi LLP and Suri & Co. (the Bank's statutory auditors)"
  source: "BRSR FY2024-25, Section I, item 14"

- id: assurance-type-fy25
  question: "What type of assurance did IDBI Bank obtain on its FY 2024-25 BRSR?"
  method: local
  category: governance
  must_include: ["reasonable assurance", "BRSR Core"]
  expected: "Reasonable assurance for the BRSR Core disclosures"
  source: "BRSR FY2024-25, Section I, item 15"

- id: reporting-boundary-fy25
  question: "What is the reporting boundary of IDBI Bank's FY 2024-25 BRSR?"
  method: local
  category: governance
  must_include: ["standalone"]
  expected: "Standalone"
  source: "BRSR FY2024-25, Section I, item 13"

- id: whistleblower-policy
  question: "Does IDBI Bank have a whistleblower / vigil mechanism policy?"
  method: local
  category: governance
  must_include: ["yes"]
  must_not_include: ["no information", "not mentioned"]
  expected: "Yes — IDBI Bank has a Whistle Blower Policy / vigil mechanism."
  source: "BRSR, Principle 1, policy disclosures"

- id: esg-committee
  question: "Which board committee at IDBI Bank oversees ESG and CSR matters?"
  method: local
  category: governance
  must_include: ["CSR", "ESG"]
  expected: "The CSR & ESG Committee of the Board"
  source: "BRSR / Annual Report governance section"

- id: anti-corruption-policy
  question: "Does IDBI Bank have an anti-bribery or anti-corruption policy?"
  method: local
  category: governance
  must_include: ["yes"]
  expected: "Yes — IDBI Bank has an Anti-Bribery and Anti-Corruption Policy."
  source: "BRSR, Principle 1"

# ---------------- Reporting / Organization ----------------
- id: frameworks-used
  question: "Which reporting framework(s) does IDBI Bank's BRSR follow?"
  method: local
  category: reporting
  must_include: ["BRSR"]
  expected: "SEBI's Business Responsibility and Sustainability Report (BRSR) format, structured around the nine NGRBC principles."
  source: "BRSR document structure; NGRBC principles P1-P9"

- id: ngrbc-principles
  question: "How many NGRBC principles does IDBI Bank report against in its BRSR?"
  method: local
  category: reporting
  must_include: ["9"]
  expected: "Nine (P1 to P9)"
  source: "BRSR, Section C / NGRBC review table"

- id: branches-fy25
  question: "How many branches did IDBI Bank operate (per the FY 2024-25 BRSR)?"
  method: local
  category: organization
  must_include: ["2127"]
  expected: "2,127 branches"
  source: "BRSR FY2024-25, Section II, locations table"

- id: main-activity
  question: "What is IDBI Bank's main business activity as described in the BRSR?"
  method: local
  category: organization
  must_include: ["bank"]
  expected: "Banking / monetary intermediation (FY2024-25 report: 'Financial and Insurance Service'; FY2025-26: 'Monetary intermediation of commercial banks', NIC 64191)"
  source: "BRSR Section I, description of main activity"

- id: company-name
  question: "What is the full legal name of the entity the BRSR reports on?"
  method: local
  category: organization
  must_include: ["IDBI Bank"]
  expected: "IDBI Bank Limited"
  source: "BRSR, Section I, item 1"

# ---------------- Global / thematic ----------------
- id: sustainability-approach
  question: "How does IDBI Bank approach sustainability and ESG overall?"
  method: global
  category: reporting
  must_include: ["BRSR"]
  expected: "Reports via BRSR/NGRBC; ESG governance under a board committee; policies on human rights, anti-corruption, whistleblowing; green deposit / sustainable finance; tracks emissions, energy, water, waste."
  source: "Whole BRSR"

- id: environmental-topics
  question: "What environmental topics does IDBI Bank disclose on?"
  method: global
  category: environmental
  must_include: ["emissions", "energy", "water"]
  expected: "GHG emissions (Scope 1/2/3), energy consumption and intensity, water withdrawal/consumption/discharge, waste."
  source: "BRSR Principle 6"

- id: stakeholder-groups
  question: "Which stakeholder groups does IDBI Bank identify and engage with?"
  method: global
  category: social
  must_include: ["customers", "employees"]
  expected: "Customers, employees, investors/shareholders, regulators/government, communities, suppliers/vendors."
  source: "BRSR Principle 4, stakeholder engagement"

# ---------------- Negative / must-decline ----------------
