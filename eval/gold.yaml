# Gold Q&A for the two ingested IDBI BRSR reports (FY 2024-25 and FY 2025-26).
# Values are ground-truthed from the source PDFs / output/chunks.parquet,
# NOT from the extracted graph — so the eval also catches extraction errors.
#
# fields: id, question, method (local|global|both), category, must_include,
#         must_not_include (optional), expected (human/judge reference), source

# ---------------- Environmental ----------------
- id: scope1-fy25
  question: "What were IDBI Bank's total Scope 1 GHG emissions for FY 2024-25?"
  method: local
  category: environmental
  must_include: ["2360.87", "tCO2e"]
  expected: "2,360.87 tCO2e"
  source: "BRSR FY2024-25, Principle 6, GHG emissions table"

- id: scope2-fy25
  question: "What were IDBI Bank's total Scope 2 GHG emissions for FY 2024-25?"
  method: local
  category: environmental
