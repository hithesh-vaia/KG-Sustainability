[project]
name = "graphrag-lite"
version = "0.1.0"
description = "A small, readable Graph RAG ingestion + retrieval pipeline (OpenRouter + Neo4j)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "openai>=1.40",
    "neo4j>=5.23",
    "fastembed>=0.3.6",
    "tiktoken>=0.7",
    "langchain-text-splitters>=0.2",
    "graspologic>=3.4",
    "networkx>=3.2",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "tenacity>=8.3",
    "numpy>=1.26",
    "pypdf>=4.2",
    "openpyxl>=3.1",
    "tabulate>=0.9",
    "pyvis>=0.3.2",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
graphrag = "cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli"]
packages = ["graphrag", "graphrag.ingest", "graphrag.retrieve", "eval"]
